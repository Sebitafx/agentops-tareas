name: Bootstrap CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bootstrap-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check bootstrap tests
      - run: python -m ruff format --check bootstrap tests
      - run: python -m pytest -q
      - run: docker build --tag agentops-bootstrap .
