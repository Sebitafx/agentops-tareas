name: Agent proposal check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-proposal-check.yml'
      - 'harness/proposal_check.py'
      - 'harness/code_proposer.py'
      - 'harness/proposals.py'
      - 'harness/evaluation_check.py'
      - 'harness/sandbox.py'
      - 'harness/offline_runner.py'
      - 'Dockerfile.validation'
permissions:
  contents: read
concurrency:
  group: agent-proposal-check
  cancel-in-progress: false
jobs:
  synthetic-proposal:
    if: github.repository == 'Sebitafx/agentops-tareas' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: docker build --file Dockerfile.validation --tag agentops-validator:${{ github.sha }} .
      - name: Generate and validate synthetic proposal in isolated container
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m harness.evaluation_check --image agentops-validator:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-proposal
          path: |
            artifacts/synthetic-proposal.json
            artifacts/evaluation-summary.json
            artifacts/latest-validation.json
          if-no-files-found: warn
          retention-days: 3
