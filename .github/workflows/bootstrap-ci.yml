name: Bootstrap CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bootstrap-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check bootstrap harness taskapp tests
      - run: python -m ruff format --check bootstrap harness taskapp tests
      - run: docker build --file Dockerfile.validation --tag agentops-validator:${{ github.sha }} .
      - run: python -m harness.sandbox --image agentops-validator:${{ github.sha }}
      - run: docker build --tag agentops-bootstrap .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-validation
          path: artifacts/latest-validation.json
          retention-days: 3
