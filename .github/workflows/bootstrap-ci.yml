name: Bootstrap CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bootstrap-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentops_test
          POSTGRES_USER: agentops_test
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentops_test -d agentops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://agentops_test:local-test-only@127.0.0.1:5432/agentops_test
      E2E_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check bootstrap harness taskapp tests
      - run: python -m ruff format --check bootstrap harness taskapp tests
      - run: python -m mypy
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q --cov=bootstrap --cov=harness --cov=taskapp --cov-branch --cov-fail-under=80
      - run: docker build --tag agentops-bootstrap .
