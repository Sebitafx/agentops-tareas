[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["bootstrap", "harness", "taskapp", "tests"]

[tool.mypy]
python_version = "3.13"
files = ["taskapp"]
follow_imports = "skip"
disallow_untyped_defs = true
