services:
  - type: web
    name: agentops-receiver
    runtime: docker
    plan: free
    autoDeployTrigger: 'off'
    healthCheckPath: /health
    envVars:
      - key: SERVICE_ROLE
        value: receiver
      - key: META_VERIFY_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ALLOWED_SENDERS
        sync: false
  - type: web
    name: agentops-tasks
    runtime: docker
    plan: free
    autoDeployTrigger: 'off'
    healthCheckPath: /health
    envVars:
      - key: SERVICE_ROLE
        value: tasks
      - key: DATABASE_URL
        sync: false
